# This is configuration file for thumbfast.lua
# The default options are listed in thumbfast.lua

# Maximum thumbnail size in pixels (scaled down to fit)
# Values are scaled when hidpi is enabled
max_height=200
max_width=200

# Spawn thumbnailer on file load for faster initial thumbnails
spawn_first=yes

# Enable on network playback
# This allows thumbnailing in videos played over network, e.g. YouTube
network=yes

# NVIDIA: decode with cuvid and downscale on the GPU before copying frames back.
# hwdec must stay off, otherwise mpv's own hwdec (d3d11va-copy) takes over and cuvid is ignored
hwdec=no
cuvid=yes
# Only used when cuvid can't open (software decoding), 0 for all cores
decode_threads=0

# HDR thumbnails: tone-map with mpv's gpu filter (mpv's bundled FFmpeg has no zscale) and keep them
# in the video's colorspace, which is how vo=gpu-next displays overlays
tone_mapping=gpu
# auto: as bright as the video when mpv outputs HDR (follows the display peak)
hdr_peak=auto
gpu_tone_mapping=mobius
gpu_tone_mapping_param=0.2
direct_io=yes
